
name: Build Minecraft Plugin (Gradle)

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # 使用官方 Gradle Action，它会自动设置 JDK（如果项目指定了 toolchain）或默认 JDK
      # 并配置高效的缓存策略
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # 如果你的项目需要特定 JDK 版本，可以在这里指定，或者在 build.gradle 中配置 toolchain
          # java-version: 21 
          # 默认情况下，setup-gradle 会尝试使用 Wrapper 指定的 Java 版本
          # 如果 Wrapper 没指定，可能需要显式安装 JDK
          
      # 如果 gradle/wrapper/gradle-wrapper.properties 中没有指定 distributionUrl 对应的 JDK 版本
      # 或者你需要强制使用 JDK 21，建议保留 setup-java 以确保环境一致
      - name: Set up JDK 21 (Optional but recommended for consistency)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew clean build
        env:
          # 可选：如果需要发布到 Maven 仓库或其他需要认证的操作
          # MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          # MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      # 关键步骤：从 gradle.properties 提取版本号并判断是否为预发布
      - name: Get Version and Check Pre-release
        id: version_step
        run: |
          # 1. 从 gradle.properties 提取版本号
          # 假设文件中有一行 version=1.0.0-SNAPSHOT
          if [ ! -f gradle.properties ]; then
            echo "Error: gradle.properties not found!"
            exit 1
          fi
          
          # 提取 version 属性的值，去除前后空格
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          
          if [ -z "$VERSION" ]; then
            echo "Error: Could not find version in gradle.properties"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted Version: $VERSION"
          
          # 2. 判断是否包含预发布标识 (不区分大小写)
          # 常见标识: SNAPSHOT, alpha, beta, rc, dev, pre
          if echo "$VERSION" | grep -iqE "(snapshot|alpha|beta|rc|dev|pre)"; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "Detected pre-release version: $VERSION"
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "Detected stable release version: $VERSION"
          fi

      # 清理不需要的文件 (Gradle 通常输出在 build/libs)
      # 如果使用了 shadow jar，可能会有不带 classifier 的原始 jar，视具体 build.gradle 配置而定
      - name: Prepare Artifacts
        run: |
          # 列出 build/libs 下的文件以便调试
          ls -l build/libs/ || echo "No build/libs directory found"
          
          # 如果存在 original jar (例如使用 shadowJar 时产生的)，可以在此清理
          # rm -f build/libs/*-original.jar 
          # 注意：Gradle 默认行为与 Maven 不同，通常只生成一个最终 jar，除非配置了多产物

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          prerelease: ${{ env.IS_PRERELEASE }}
          body: |
            Auto release for v${{ env.VERSION }}
            
            **Type:** ${{ env.IS_PRERELEASE == 'true' && 'Pre-release' || 'Stable Release' }}
            
            **Commit Message:**
            ${{ github.event.head_commit.message }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
